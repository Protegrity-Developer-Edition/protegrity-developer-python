{% set name = "protegrity-ai-developer-python" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Building from local source
  path: ..

build:
  number: 0
  noarch: python
  entry_points:
    - pty-migrate = pty_migrate.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61.0
  run:
    - python >=3.10
    - requests
    # botocore powers PTY_AUTH_MODE=aws_iam (SigV4 signing) — the default
    # auth path for Cloud Protect deployed behind AWS API Gateway.
    - botocore
    # PyYAML parses the optional ~/.protegrity/config.yaml config file
    # (PTY_CONFIG_FILE) used for Team Edition / Cloud Protect settings.
    - pyyaml >=6.0

test:
  imports:
    - protegrity_developer_python
    - appython
    - pty_migrate
  commands:
    - pip check
    - pty-migrate --help
  requires:
    - pip

about:
  home: https://www.protegrity.com/developers
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python module for integrating Protegrity's Data Discovery and Protection APIs into GenAI and traditional applications
  description: |
    This repository contains two powerful modules designed to handle different aspects of data protection:
    
    - protegrity_developer_python - Focuses on data discovery, classification, and redaction of 
      Personally Identifiable Information (PII) in unstructured text
    - appython - Provides comprehensive data protection and unprotection capabilities for structured data
    
    Part of the Protegrity AI Developer Edition suite for integrating Protegrity's APIs into applications.
  doc_url: http://developer.docs.protegrity.com
  dev_url: https://github.com/Protegrity-Developer-Edition/protegrity-ai-developer-python

extra:
  recipe-maintainers:
    - Protegrity
